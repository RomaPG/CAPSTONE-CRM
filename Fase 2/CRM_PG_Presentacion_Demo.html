<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM PG · Presentación y demo</title><style>
:root{--ink:#132c3a;--accent:#157f78;--bg:#f2f5f5;--muted:#667980}*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:12px 18px;background:var(--accent);color:white}button.secondary{background:white;color:var(--ink);border:1px solid #cfdcde}button:disabled{opacity:.4;cursor:default}header{display:flex;align-items:center;justify-content:space-between;padding:20px 4vw;border-bottom:1px solid #d8e2e4;background:white}.brand{font-size:22px;font-weight:800}.brand span{color:var(--accent)}.badge{background:#e3f3ed;color:#266353;padding:7px 12px;border-radius:30px;font-size:12px;font-weight:700}.slide{min-height:calc(100vh - 163px);padding:5vh 8vw;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(ellipse at 100% 0,#e0eeee,transparent 60%),white}.eyebrow{text-transform:uppercase;font-size:13px;letter-spacing:3px;color:var(--accent);font-weight:700}h1{font-size:clamp(34px,5vw,72px);line-height:1.07;max-width:1000px;margin:20px 0 28px;letter-spacing:-2px}h2{font-size:32px;margin:6px 0 20px}h3{margin-top:0}p{line-height:1.6}.lead{font-size:clamp(19px,2vw,28px);max-width:980px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{border:1px solid #dce6e7;border-radius:14px;padding:25px;background:white}.card p{margin:8px 0}.num{font-size:38px;font-weight:800;color:var(--accent)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.steps .card{border-top:4px solid var(--accent)}footer{padding:15px 4vw;display:flex;gap:16px;align-items:center;background:white;border-top:1px solid #d8e2e4}footer .progress{flex:1;color:var(--muted)}.notes{display:none;padding:15px 8vw;background:#fff6d9;line-height:1.5}.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 80px)}.sidebar{background:#132c3a;padding:25px 15px;color:white}.sidebar button{width:100%;background:transparent;text-align:left;margin:3px 0;color:#bdd0d4}.sidebar button.active{background:#28505a;color:white}.main{padding:28px 4vw}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px}.muted{color:var(--muted)}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{text-align:left;padding:14px;border-bottom:1px solid #e1e9ea}th{font-size:12px;text-transform:uppercase;color:var(--muted)}.tag{font-size:12px;padding:6px 10px;border-radius:20px;background:#e4f2ee;color:#286755}.warning{background:#fff0d2;color:#855913}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}.hint{padding:15px 20px;background:#e3efef;border-left:4px solid var(--accent);border-radius:5px;margin:20px 0}.actions{display:flex;gap:12px;flex-wrap:wrap}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.board .card{padding:18px;background:#f8fbfb}input,select{padding:12px;border:1px solid #bbcccf;border-radius:6px;width:100%;margin:8px 0 16px}label{display:block}.toast{position:fixed;bottom:25px;right:25px;padding:18px 24px;background:#143f37;color:white;border-radius:12px;box-shadow:0 6px 30px #0002;z-index:10}dialog{border:0;border-radius:15px;padding:28px;width:min(480px,90vw)}dialog::backdrop{background:#102c3b80}.link{color:var(--accent)}@media(max-width:800px){.grid,.steps,.stats,.board{grid-template-columns:1fr 1fr}.app{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;padding:8px}.sidebar button{white-space:nowrap;width:auto}.slide{padding:35px 6vw}header{gap:12px}.badge{font-size:10px}table{font-size:13px}td,th{padding:9px}.topline{align-items:flex-start}h1{letter-spacing:-1px}}@media print{header,footer,.notes{display:none}.slide{min-height:90vh;page-break-after:always}}
</style></head><body><header><div class="brand">CRM <span>PG</span> <small style="font-size:12px;font-weight:400">HERMANOS PG SPA</small></div><span class="badge">PROTOTIPO ACADÉMICO · DATOS FICTICIOS</span><button class="secondary" onclick="full()">Pantalla completa</button></header><main id="root"></main><div id="notes" class="notes"></div><footer id="footer"><button class="secondary" onclick="move(-1)">← Anterior</button><span id="counter" class="progress"></span><button class="secondary" onclick="toggleNotes()">Guion</button><button onclick="move(1)">Siguiente →</button></footer><dialog id="modal"></dialog><script>
const slides=[
['Proyecto de título','CRM PG','Sistema de gestión comercial y seguimiento de producción para HERMANOS PG SPA.','Romario Pocito · Ingeniería en Informática','Presento CRM PG, una propuesta basada en el funcionamiento real de una empresa familiar fabricante de urnas. Hoy mostraré el problema, el diseño de la solución y un prototipo navegable.'],
['Integrantes','Responsable del proyecto','Romario Pocito','Levantamiento del negocio, diseño del sistema y desarrollo del prototipo. Participación de la empresa en la validación de los procesos.','Mi rol es transformar el conocimiento de la empresa en requerimientos y una solución que sus responsables puedan utilizar.'],
['Contexto','La información acompaña al pedido', ['Problema|Cuadernos por área, stock aproximado y consultas verbales para conocer el avance.','Justificación|Centralizar el pedido permite vincular producción, entregas y cantidades pendientes.'], 'Empresa familiar con más de 10 años en fabricación de urnas.','La empresa recibe órdenes de compra de funerarias. La información está distribuida y depende de las personas. El sistema busca facilitar el seguimiento de cada pedido.'],
['Objetivo General','Centralizar la gestión de pedidos','Desarrollar una aplicación web para HERMANOS PG SPA que permita gestionar clientes y pedidos, seguir el avance productivo y controlar las entregas, con acceso según responsabilidades.','Resultado esperado: conocer qué se pidió, qué se fabrica y qué falta entregar.','El objetivo es dar trazabilidad al pedido completo y una visión compartida del estado de la operación.'],
['Objetivos Específicos','Del levantamiento al prototipo',['Clientes y catálogo|Organizar modelos, características y equivalencias.','Pedidos y producción|Vincular cantidades solicitadas con el avance por área.','Entregas|Controlar despachos parciales y saldos pendientes.','Acceso|Diseñar roles, permisos y autorizaciones por operación.'],'Objetivos del desarrollo, con implementación incremental.','Estos objetivos se implementarán por etapas. La demo de hoy representa el comportamiento propuesto, con datos ficticios.'],
['Alcance Proyecto','Un núcleo operativo acotado',['Primera etapa propuesta|Clientes, catálogo, pedidos, producción, inventario y despachos.','Restricciones actuales|Demo local simulada. Sin autenticación real, persistencia compartida ni emisión tributaria.'],'Finanzas completas, asistencia y remuneraciones quedan para etapas posteriores.','El plan integral de la empresa es más amplio. Para el proyecto priorizo el flujo del pedido. La demo no está conectada a los servicios reales.'],
['Requerimientos','Reglas que guían el sistema',['Funcionales|Registrar pedidos y modelos. Actualizar etapas. Registrar entregas parciales. Consultar pendientes.','No funcionales|Interfaz responsiva. Validación de cantidades. Acceso controlado. Trazabilidad de modificaciones.'],'Regla central: considerar para facturación solo las unidades efectivamente entregadas.','Una entrega parcial debe descontarse del saldo por entregar. La seguridad deberá aplicarse en servidor y base de datos, no depender de ocultar botones.'],
['Metodología','Desarrollo iterativo e incremental',['01 · Levantar|Revisar procesos con responsables de la empresa.','02 · Diseñar|Definir datos, reglas y maquetas.','03 · Construir|Implementar un flujo funcional por incremento.','04 · Validar|Probar casos y ajustar con usuarios.'],'El prototipo sirve para validar antes de completar la implementación.','La metodología propuesta permite validar cada incremento. La evidencia actual corresponde al levantamiento, las maquetas y la base de autorizaciones.'],
['Cronograma','Ruta de trabajo por hitos',['Levantamiento|Contexto y procesos documentados.','Diseño|Maquetas y estructura de datos en desarrollo.','Implementación|Conectar el flujo prioritario a la base de datos.','Validación|Probar permisos, entregas y casos de error.'],'Plan referencial. Fechas sujetas al calendario académico.','No presento fechas inventadas. El siguiente hito es completar una cuenta administradora segura y conectar el flujo mínimo de pedidos.'],
['Tecnologías y Herramientas','Interfaz web y datos relacionales',['Prototipo actual|HTML, CSS y JavaScript. Interacciones en memoria del navegador.','Backend previsto|Supabase, PostgreSQL, autenticación y políticas RLS.'],'SQL para migraciones. GitHub previsto para respaldo y control de versiones.','La demo usa JavaScript en el navegador. El diseño de datos utiliza PostgreSQL en Supabase. El respaldo en GitHub y la integración están pendientes de completar.'],
['Arquitectura de la Aplicación','Separar interfaz, reglas y datos',['Interfaz web|Formularios y vistas por módulo.','Servicios y reglas|Autenticación, validación y operaciones autorizadas.','Base de datos|Clientes, modelos, pedidos y sus relaciones.','Seguridad transversal|Roles, RLS, autorizaciones y eventos de auditoría.'],'Arquitectura propuesta. La demo reproduce únicamente la capa de interacción.','La migración 0004 crea tablas de autorizaciones, solicitudes y auditoría. Se reportó RLS activa y privilegios revocados. Faltan funciones de autorización y auditoría automática.'],
['Modelo de Negocio','Gestión interna para una empresa B2B','HERMANOS PG fabrica urnas y abastece a funerarias. El software apoya su operación interna y la relación con sus clientes.','Valor esperado: consultar pendientes y coordinar entregas. Sin ahorro ni retorno cuantificado todavía.','No propongo una suscripción comercial validada. El primer usuario es la empresa familiar. El beneficio debe medirse al comparar tiempos y errores antes y después.'],
['Demostración','Un pedido, de principio a fin','Pedido de ejemplo: 20 urnas del modelo PG-01 para una funeraria ficticia.','5 minutos · pedido, producción, inventario, entrega parcial y autorización.','Ahora mostraré un caso preparado. Todo lo que cambia en esta demo es una simulación de interfaz y se puede reiniciar.'],
['Mejoras futuras','Completar y validar el flujo',['Integración real|Cuenta administradora, autenticación y persistencia en Supabase.','Reglas y pruebas|Autorizaciones por operación, auditoría y control de entregas concurrentes.','Ampliaciones|Compras, reportes financieros y otros módulos del plan integral.','Adopción|Prueba piloto con responsables y ajuste de formularios.'],'Prioridad: un flujo completo probado antes de ampliar módulos.','Antes de ampliar funcionalidades, debo verificar que las reglas se mantengan para distintos usuarios y que cada cambio quede registrado.'],
['Conclusión','El proceso real define la solución','CRM PG propone reunir información que hoy se encuentra dispersa y relacionarla con cada pedido.','Avance actual: levantamiento, diseño, base de seguridad y prototipo navegable.','El aporte actual es traducir una necesidad real en una solución verificable. El próximo paso es completar un flujo persistente y validarlo con usuarios.'],
['Cierre','Gracias','Romario Pocito','CRM PG · HERMANOS PG SPA','Quedo atento a las preguntas y observaciones sobre alcance, diseño y reglas del negocio.']];
let page=0,showNotes=false,module='Dashboard';const initial=()=>({created:false,stage:0,delivered:0,stock:8,request:false,approved:false,executed:false,events:[]});let state=initial();const modules=['Dashboard','Clientes','Catálogo','Pedidos','Producción','Inventario','Despachos','Autorizaciones'];
function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
function cards(items){return '<div class="'+(items.length===4?'steps':'grid')+'">'+items.map(x=>{let [a,b]=x.split('|');return `<div class="card"><h3>${a}</h3><p>${b}</p></div>`}).join('')+'</div>'}
function render(){document.getElementById('footer').style.display='flex';let [e,t,c,sub,n]=slides[page];root.innerHTML=`<section class="slide"><div class="eyebrow">${e}</div><h1>${t}</h1>${Array.isArray(c)?cards(c):`<p class="lead">${c}</p>`}<p class="muted">${sub}</p>${page===12?'<div><button onclick="openDemo()">▶ Ouvrir la démonstration</button></div>'.replace('Ouvrir la démonstration','Abrir demostración interactiva'):''}</section>`;counter.textContent=`${page+1} / 16 · Presentación 5 min · Flechas para avanzar`;notes.textContent=n;notes.style.display=showNotes?'block':'none'}
function move(d){page=Math.max(0,Math.min(15,page+d));render()}function toggleNotes(){showNotes=!showNotes;render()}document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(!demo){if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)}if(e.key==='Escape'&&demo)back()});let demo=false;function back(){demo=false;page=12;render()}function openDemo(){demo=true;module='Dashboard';app()}function toast(t){let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3200)}function event(t){state.events.unshift(t);toast(t)}function nav(m){module=m;app()}function kpi(n,t){return `<div class="card"><div class="num">${n}</div><div class="muted">${t}</div></div>`}function table(head,rows){return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')}</tbody></table>`}function btn(t,fn,disabled=false){return `<button onclick="${fn}" ${disabled?'disabled':''}>${t}</button>`}
function app(){document.getElementById('footer').style.display='none';notes.style.display='none';root.innerHTML=`<div class="app"><aside class="sidebar"><p style="padding:0 12px">ESPACIO DE DEMO</p>${modules.map(m=>`<button class="${m===module?'active':''}" onclick="nav('${m}')">${m}</button>`).join('')}<hr><button onclick="back()">← Volver a presentación</button><button onclick="reset()">Reiniciar demo</button></aside><section class="main"><div class="topline"><div><div class="eyebrow">Operación / ${module}</div><h2>${module}</h2></div><span class="badge">Sesión simulada · Administración</span></div><div class="hint">Prototipo sin conexión al backend. Los cambios duran mientras esta página permanezca abierta.</div>${content()}</section></div>`}
const stages=['Carpintería','Barnizado','Terminación','Control de calidad'];function content(){switch(module){case'Dashboard':return `<p class="muted">Recorrido recomendado: crear un pedido, avanzar producción y registrar una entrega parcial.</p><div class="stats">${kpi(state.created?1:0,'Pedido de ejemplo')}${kpi(state.created?20-state.delivered:0,'Unidades por entregar')}${kpi(state.delivered,'Unidades entregadas')}${kpi(state.stock,'Litros de barniz')}</div><div class="grid"><div class="card"><h3>Caso de evaluación</h3><p>Funeraria de ejemplo · Modelo PG-01 · 20 unidades.</p><p>Demostrar una entrega de 5 y un saldo pendiente de 15.</p>${btn('Comenzar en Pedidos',"nav('Pedidos')")}</div><div class="card"><h3>Actividad simulada</h3>${state.events.length?state.events.map(x=>'<p>'+x+'</p>').join(''):'<p class="muted">Aún no hay operaciones. Inicia el recorrido.</p>'}</div></div>`;case'Clientes':return `<div class="card"><h3>Directorio comercial</h3>${table(['Cliente','Condición','Contacto'],[['Funeraria de ejemplo','Pago diferido','Datos ficticios']])}<p>La ficha centraliza pedidos, condiciones comerciales y entregas del cliente.</p>${btn('Ver sus pedidos',"nav('Pedidos')")}</div>`;case'Catálogo':return `<div class="grid"><div class="card"><div class="eyebrow">PG-01 · Modelo de ejemplo</div><h2>Urna estándar</h2><p>Ficha ilustrativa para validar los campos del catálogo.</p>${table(['Característica','Valor de ejemplo'],[['Material','Madera y terciado'],['Acabado','Barnizado natural'],['Tapa','Diseño estándar'],['Manillas','Metálicas'],['Interior','Tela clara'],['Medidas','A confirmar por catálogo real']])}</div><div class="card"><h3>Especificaciones especiales</h3><p>El diseño contempla variaciones de color, dimensiones e interior, además de equivalencias de nombres por cliente.</p><span class="tag">Valores ilustrativos</span></div></div>`;case'Pedidos':return `<div class="card"><div class="topline"><h3>Órdenes de compra de clientes</h3>${btn('Nuevo pedido',"orderDialog()",state.created)}</div>${state.created?table(['OC','Cliente','Modelo','Cantidad','Pendiente'],[['DEMO-001','Funeraria de ejemplo','PG-01',20,20-state.delivered]]):'<p class="muted">Crea el pedido preparado para comenzar la demostración.</p>'}<p>La OC del cliente origina el trabajo productivo. Un despacho parcial conserva el saldo pendiente.</p>${state.created?btn('Ver producción',"nav('Producción')"):''}</div>`;case'Producción':return !state.created?empty():`<p>OP-DEMO-001 · 20 unidades · Modelo PG-01</p><div class="board">${stages.map((s,i)=>`<div class="card"><span class="tag ${i>state.stage?'warning':''}">${i<state.stage?'Completada':i===state.stage?'En curso':'Pendiente'}</span><h3 style="margin-top:20px">${s}</h3><p>${i===state.stage?'Lote de 20 unidades':i<state.stage?'Etapa cerrada':'Espera etapa anterior'}</p></div>`).join('')}</div><div class="hint">Avance por lote simplificado para esta demo. Cada clic completa una etapa.</div>${btn(state.stage<3?'Completar etapa y avanzar':'Lote listo para despacho',"advance()",state.stage>=4)} ${btn('Ver inventario',"nav('Inventario')")}`;case'Inventario':return `<div class="card"><h3>Materias primas</h3>${table(['Insumo','Stock','Mínimo','Estado'],[['Barniz',state.stock+' litros','10 litros',`<span class="tag ${state.stock<10?'warning':''}">${state.stock<10?'Bajo mínimo':'Disponible'}</span>`],['Terciado','25 planchas','10 planchas','Disponible'],['Manillas','120 unidades','40 unidades','Disponible']])}${btn('Registrar entrada de barniz',"stockDialog()")}</div>`;case'Despachos':return !state.created?empty():`<div class="stats">${kpi(20,'Solicitadas')}${kpi(state.stage>=4?20-state.delivered:0,'Listas para entregar')}${kpi(state.delivered,'Entregadas')}${kpi(20-state.delivered,'Pendientes')}</div><div class="card"><h3>Entrega parcial · DEMO-001</h3><p>Las unidades entregadas constituyen la base para facturación. Esta demo no emite documentos tributarios ni calcula montos.</p>${state.stage<4?'<p class="tag warning">Completa las etapas de producción primero.</p>':btn('Registrar entrega parcial',"dispatchDialog()",state.delivered>=20)}${state.delivered?'<p>Última entrega registrada en esta sesión. Unidades entregadas acumuladas: '+state.delivered+'.</p>':''}</div>`;case'Autorizaciones':return `<div class="grid"><div class="card"><h3>Cambio por operación</h3><p>Ejemplo: modificar el color de un pedido. Un usuario solicita y otro revisa.</p><p>Solicitante simulado: Operaciones.<br>Revisor simulado: Gerencia.</p><span class="tag">${state.executed?'Ejecutada':state.approved?'Aprobada':state.request?'Pendiente':'Sin solicitud'}</span><div class="actions" style="margin-top:20px">${btn('1. Solicitar cambio',"request()",state.request||!state.created)}${btn('2. Aprobar como Gerencia',"approve()",!state.request||state.approved)}${btn('3. Ejecutar cambio',"execute()",!state.approved||state.executed)}</div>${!state.created?'<p>Crea primero el pedido de ejemplo.</p>':''}</div><div class="card"><h3>Diseño de seguridad</h3><p>Permisos especiales temporales o permanentes y solicitudes para una operación concreta.</p><p>La migración 0004 crea estructuras con RLS. Las funciones de autorización y auditoría automática están pendientes.</p><p class="muted">Cambiar de rol aquí representa una simulación del flujo, sin autenticación real.</p></div></div>`}}
function empty(){return '<div class="card"><p>Primero crea el pedido DEMO-001.</p>'+btn('Ir a Pedidos',"nav('Pedidos')")+'</div>'}function reset(){state=initial();module='Dashboard';app();toast('Demo reiniciada')}
function dialog(html){modal.innerHTML=html;modal.showModal()}function orderDialog(){dialog(`<h2>Nuevo pedido de ejemplo</h2><p>Datos ficticios preparados para la evaluación.</p><label>Cliente<input readonly value="Funeraria de ejemplo"></label><label>Modelo<input readonly value="PG-01 · Urna estándar"></label><label>Cantidad<input readonly value="20 unidades"></label><div class="actions">${btn('Crear pedido',"createOrder()")}${btn('Cancelar',"modal.close()")}</div>`)}function createOrder(){if(state.created)return;state.created=true;modal.close();event('Pedido DEMO-001 creado: 20 unidades');app()}function advance(){if(!state.created||state.stage>=4)return;state.stage++;event(state.stage===4?'Lote de 20 unidades listo para despacho':'Etapa completada: '+stages[state.stage-1]);app()}
function stockDialog(){dialog(`<h2>Entrada de barniz</h2><form onsubmit="addStock(event)"><label>Litros recibidos<input id="qty" type="number" min="1" max="1000" step="1" value="12" required></label><p>Entrada ilustrativa. No está vinculada a una compra real.</p><button>Registrar entrada</button> <button type="button" class="secondary" onclick="modal.close()">Cancelar</button></form>`)}function addStock(e){e.preventDefault();let q=Number(document.getElementById('qty').value);if(!Number.isInteger(q)||q<1||q>1000)return;state.stock+=q;modal.close();event('Entrada registrada: '+q+' litros de barniz');app()}
function dispatchDialog(){dialog(`<h2>Entrega parcial</h2><form onsubmit="dispatch(event)"><label>Unidades entregadas<input id="qty" type="number" min="1" max="${20-state.delivered}" value="${Math.min(5,20-state.delivered)}" required></label><p>Disponible: ${20-state.delivered}. No permite entregar más del saldo.</p><button>Confirmar entrega</button> <button type="button" class="secondary" onclick="modal.close()">Cancelar</button></form>`)}function dispatch(e){e.preventDefault();let q=Number(document.getElementById('qty').value);if(state.stage<4||!Number.isInteger(q)||q<1||q>20-state.delivered)return;state.delivered+=q;modal.close();event('Entrega de '+q+' registrada. Pendientes: '+(20-state.delivered));app()}function request(){if(!state.created||state.request)return;state.request=true;event('Operaciones solicita cambio a color nogal por requerimiento del cliente');app()}function approve(){if(!state.request||state.approved)return;state.approved=true;event('Gerencia aprueba el cambio para DEMO-001');app()}function execute(){if(!state.approved||state.executed)return;state.executed=true;event('Cambio de color a nogal ejecutado en el pedido de ejemplo');app()}if(location.hash==='#demo')openDemo();else render();
</script></body></html>
